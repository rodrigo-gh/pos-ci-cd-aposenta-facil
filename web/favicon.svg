<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" />
  <!-- Subtle inner border highlight -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Bold dollar sign -->
  <text x="32" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">$</text>
</svg>
